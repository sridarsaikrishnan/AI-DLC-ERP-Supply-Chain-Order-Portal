# Local development stack (Phase 1: backing services).
# Brings up the infrastructure a developer needs: the portal Postgres, the AWS emulator
# (floci) for SNS/SQS, and a local Odoo. The api/worker application services are added
# here in Phase 2 once the GraphQL/worker hosts are built.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal"]
      interval: 5s
      timeout: 3s
      retries: 10

  # AWS emulator (SNS/SQS/Secrets Manager/...). Same boto3 code targets this locally
  # and real AWS in prod — only AWS_ENDPOINT_URL differs.
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"

  odoo-db:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data

  odoo:
    image: odoo:17
    depends_on:
      - odoo-db
    command: ["-d", "odoo", "-i", "base,contacts,sale_management"]
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "8069:8069"
    volumes:
      - odoo-web:/var/lib/odoo

volumes:
  pgdata:
  odoo-db-data:
  odoo-web:
