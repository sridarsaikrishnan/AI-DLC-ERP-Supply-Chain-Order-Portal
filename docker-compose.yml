services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal"]
      interval: 5s
      timeout: 3s
      retries: 10

  app1:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://portal:portal@postgres:5432/portal
      APP_ROLE: both
      POLL_INTERVAL_MS: "1500"
      JOB_MAX_ATTEMPTS: "5"
      RETRY_BACKOFF_CAP_MS: "60000"
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy

  app2:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://portal:portal@postgres:5432/portal
      APP_ROLE: both
      POLL_INTERVAL_MS: "1500"
      JOB_MAX_ATTEMPTS: "5"
      RETRY_BACKOFF_CAP_MS: "60000"
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy

  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - app1
      - app2

volumes:
  pgdata:
